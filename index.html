<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта мест для фото</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .leaflet-popup-content {
            text-align: center;
            min-width: 200px;
            max-width: 260px;
        }
        .place-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }
        .place-desc {
            font-size: 13px;
            color: #666;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            z-index: 9999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ Загрузка мест...</div>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([55.7558, 37.6173], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var API_URL = 'https://pgf-bbot.onrender.com/get_places';

        function loadPlaces() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error('Сервер вернул ошибку: ' + response.status);
                    return response.json();
                })
                .then(places => {
                    document.getElementById('loading').style.display = 'none';
                    if (!Array.isArray(places) || places.length === 0) {
                        L.popup()
                            .setLatLng(map.getCenter())
                            .setContent('😕 Пока нет одобренных мест. Добавь своё через бота!')
                            .openOn(map);
                        return;
                    }
                    places.forEach(function(place) {
                        var popupContent = `
                            <div>
                                <div class="place-name">${place.name}</div>
                                <div class="place-desc">ID: ${place.id}</div>
                            </div>
                        `;
                        L.marker([place.lat, place.lon])
                            .addTo(map)
                            .bindPopup(popupContent);
                    });
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    console.error('Ошибка загрузки мест:', error);
                    L.popup()
                        .setLatLng(map.getCenter())
                        .setContent('❌ Не удалось загрузить места. Проверь интернет и попробуй позже.')
                        .openOn(map);
                });
        }

        map.whenReady(function() {
            loadPlaces();
        });

        L.control.locate({
            position: 'topleft',
            strings: { title: 'Моё местоположение' }
        }).addTo(map);
    </script>
</body>
</html>
