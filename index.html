<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка API</title>
</head>
<body>
    <h1>Проверка соединения с ботом</h1>
    <button onclick="loadData()">Загрузить места</button>
    <pre id="output">Нажми кнопку</pre>

    <script>
        function loadData() {
            const output = document.getElementById('output');
            output.textContent = '⏳ Загрузка...';
            
            fetch('https://pgf-bbot.onrender.com/get_places')
                .then(response => {
                    output.textContent = 'Статус: ' + response.status;
                    if (!response.ok) throw new Error('Ошибка: ' + response.status);
                    return response.json();
                })
                .then(data => {
                    output.textContent = '✅ Данные получены:\n' + JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    output.textContent = '❌ Ошибка:\n' + error.message;
                });
        }
    </script>
</body>
</html>
