<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта мест для фото</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .leaflet-popup-content {
            text-align: center;
            min-width: 200px;
            max-width: 260px;
        }
        .place-name {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 4px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="loading">⏳ Загрузка мест...</div>
    <div id="map"></div>
    <script>
        // --- 1. КАРТА ---
        var map = L.map('map').setView([58.60, 32.53], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- 2. АДРЕС ТВОЕГО API (Render) ---
        var API_URL = 'https://pgf-bbot.onrender.com/get_places';

        // --- 3. ЗАГРУЗКА МЕСТ ---
        function loadPlaces() {
            fetch(API_URL)
                .then(response => {
                    if (!response.ok) throw new Error('Ошибка сервера: ' + response.status);
                    return response.json();
                })
                .then(places => {
                    document.getElementById('loading').style.display = 'none';

                    if (!Array.isArray(places) || places.length === 0) {
                        L.popup()
                            .setLatLng(map.getCenter())
                            .setContent('😕 Пока нет одобренных мест. Добавь своё через бота!')
                            .openOn(map);
                        return;
                    }

                    places.forEach(function(place) {
                        // --- МЫ УБРАЛИ ФОТО ИЗ ПОПАПА, ЧТОБЫ МЕТКА ТОЧНО ПОЯВИЛАСЬ ---
                        var popupContent = `
                            <div>
                                <div class="place-name">📍 ${place.name}</div>
                                <div style="font-size:13px;color:#666;">ID: ${place.id}</div>
                            </div>
                        `;

                        L.marker([place.lat, place.lon])
                            .addTo(map)
                            .bindPopup(popupContent);
                    });
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    console.error('Ошибка загрузки мест:', error);
                    L.popup()
                        .setLatLng(map.getCenter())
                        .setContent('❌ Не удалось загрузить места. Проверь интернет и попробуй позже.')
                        .openOn(map);
                });
        }

        map.whenReady(function() {
            loadPlaces();
        });

        // Кнопка геолокации
        L.control.locate({
            position: 'topleft',
            strings: { title: 'Моё местоположение' }
        }).addTo(map);
    </script>
</body>
</html>
